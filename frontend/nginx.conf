server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable runtime DNS resolution for Docker service names
    resolver 127.0.0.11 valid=30s;

    # --- Global CORS headers for API / python proxied endpoints ---
    # These are returned for successful responses; use "always" so they appear on error codes too.
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization,Origin, X-Requested-With, Content-Type, Accept" always;

    # Serve static files normally
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend service (match /api and subpaths)
    set $backend_host backend;
    location ^~ /api {
        # Handle CORS preflight quickly
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://$backend_host:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # Proxy Python microservice endpoints (both /python and /python/ paths)
    set $python_host pythonms;
    location ^~ /python {
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # forward the full original URI so backend sees the same path/query
        proxy_pass http://$python_host:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
