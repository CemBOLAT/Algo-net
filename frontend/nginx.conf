server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable runtime DNS resolution for Docker service names
    resolver 127.0.0.11 valid=30s;
    
    # Çift slash'leri tek slash'e dönüştür
    merge_slashes on;

    # --- Global CORS headers for API / python proxied endpoints ---
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization,Origin, X-Requested-With, Content-Type, Accept" always;

    # 1. Assetler için özel location (hem /assets hem /algonet/assets)
    location /assets/ {
        alias /usr/share/nginx/html/algonet/assets/;
    }

    # 2. /algonet/ altındaki tüm istekler için SPA routing
    location /algonet/ {
        try_files $uri $uri/ /algonet/index.html;
    }
    
    # 3. /algonet/index.html için explicit location
    location = /algonet/index.html {
        root /usr/share/nginx/html;
    }

    # 4. Proxy API requests to backend service
    set $backend_host backend;
    location ^~ /api {
        rewrite ^/api//+(.*)$ /api/$1 break;

        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://$backend_host:8080$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # 5. Proxy Python microservice endpoints
    set $python_host pythonms;
    location ^~ /python {
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://$python_host:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # 6. CATCH-ALL: Diğer tüm istekler (örn: /login, //login, /dashboard, /)
    # SPA için index.html'e yönlendir
    location / {
        # Eğer tam olarak root path ise, direkt /algonet/index.html döndür
        # Aksi halde dosyayı bulmaya çalış, bulamazsa yine /algonet/index.html
        try_files $uri /algonet/index.html;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
