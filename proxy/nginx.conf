server {
    listen 80;
    server_name _;

    # Gateway SSL'i sonlandırıyor, buraya HTTP geliyor
    absolute_redirect off;
    
    # Çift slash'leri tek slash'e dönüştür
    merge_slashes on;
    
    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # 1. Backend Service (Spring Boot)
    # Regex ile hem /api/ hem /api// yakala
    location ~ ^/api/+ {
        proxy_pass http://backend:8080$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Pythonms - Çift prefix düzeltmesi
    # /pythonms/pythonms/... -> pythonms:8000/...
    location ~ ^/pythonms/pythonms/+(.*)$ {
        proxy_pass http://pythonms:8000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Pythonms - Normal yönlendirme
    # /pythonms/... -> pythonms:8000/...
    location ~ ^/pythonms/+(.*)$ {
        proxy_pass http://pythonms:8000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Frontend Service
    # Hem normal hem çift slash'li istekleri frontend'e gönder
    location ~ ^/+ {
        proxy_pass http://frontend:80$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
