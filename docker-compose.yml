version: '3.8'
services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl # Sertifikaları buraya bağladık
    depends_on:
      - backend
      - frontend
      - pythonms
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # backend is reachable only internally; proxy will expose a single external port
    env_file:
      - ./backend/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/algonet
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - APP_JWT_SECRET=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      # allow CORS from the proxy (set to '*' to permit proxy-origin and simplify dev)
      - APP_CORS_ALLOWED_ORIGIN=*
    depends_on:
      - db
      - pythonms

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # frontend served internally; proxy will forward external traffic to it

  pythonms:
    platform: linux/amd64
    build:
      context: ./pythonMS
      dockerfile: Dockerfile
      args:
        # enable installation of the `cplex` wheel from PyPI during image build
        INSTALL_CPLEX: "true"
    volumes:
      - ./pythonMS:/app
    environment:
      - PYTHONPATH=/app
    # pythonms is internal; proxy will forward requests for python endpoints

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: algonet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
