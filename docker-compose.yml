version: '3.8'
services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl # Sertifikaları buraya bağladık
    depends_on:
      - backend
      - frontend
      - pythonms
      - db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build  # Use the JDK stage, not the JRE stage
      network: host
    # backend is reachable only internally; proxy will expose a single external port
    env_file:
      - ./backend/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/algonet
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - APP_JWT_SECRET=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      # allow CORS from the proxy (set to '*' to permit proxy-origin and simplify dev)
      - APP_CORS_ALLOWED_ORIGIN=*
    volumes:
      - ./backend:/app
    command: ["./gradlew", "bootRun"]
    depends_on:
      - db
      - pythonms
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder  # Stop at the Node.js stage, skip Nginx
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevent host node_modules from overwriting container's
    environment:
      - VITE_PYTHON_BASE=/pythonms
      - VITE_API_BASE=
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    # frontend served internally; proxy will forward external traffic to it
    restart: always

  pythonms:
    platform: linux/amd64
    build:
      context: ./pythonMS
      dockerfile: Dockerfile
      args:
        # enable installation of the `cplex` wheel from PyPI during image build
        INSTALL_CPLEX: "true"
    volumes:
      - ./pythonMS:/app
    environment:
      - PYTHONPATH=/app
    command: ["gunicorn", "pythonMS.wsgi_cors:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "3000", "--reload"]
    # pythonms is internal; proxy will forward requests for python endpoints
    restart: always

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: algonet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
